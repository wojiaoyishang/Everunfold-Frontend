name: everunfold-frontend

x-frontend-image: &frontend-image
  image: ${FRONTEND_IMAGE:-everunfold-frontend:node22}
  build:
    context: ..
    dockerfile: docker/Dockerfile
    args:
      BUILD_REVISION: ${EVERUNFOLD_BUILD_REVISION:-unknown}
      BUILD_CREATED: ${EVERUNFOLD_BUILD_CREATED:-unknown}
  user: "${EVERUNFOLD_UID:-1000}:${EVERUNFOLD_GID:-1000}"

services:
  frontend:
    <<: *frontend-image
    init: true
    restart: unless-stopped
    stop_grace_period: ${FRONTEND_STOP_GRACE_PERIOD:-35s}
    container_name: ${FRONTEND_CONTAINER_NAME:-everunfold-frontend}
    network_mode: ${EVERUNFOLD_NETWORK:-bridge}
    environment:
      CONFIG_FILE: /config/${EVERUNFOLD_CONFIG_NAME:-config.yaml}
      EVERUNFOLD_DATA_DIR: /data
      FRONTEND_PORT: "${FRONTEND_WEB_PORT:-3000}"
    ports:
      - "${FRONTEND_BIND_ADDRESS:-127.0.0.1}:${FRONTEND_PUBLISH_PORT:-3000}:${FRONTEND_WEB_PORT:-3000}"
    volumes:
      - type: bind
        source: ${FRONTEND_ARTIFACT_DIR:-./output/pre-1}
        target: /workspace
        bind:
          create_host_path: false
      - type: bind
        source: ${FRONTEND_DATA_DIR:-./data}
        target: /data
        bind:
          create_host_path: false
      - type: bind
        source: ${EVERUNFOLD_CONFIG_DIR:-..}
        target: /config
        bind:
          create_host_path: false

  builder:
    <<: *frontend-image
    profiles: [build]
    init: true
    environment:
      FRONTEND_BUILD_WORKERS: "${FRONTEND_BUILD_WORKERS:-2}"
      NODE_OPTIONS: "${FRONTEND_BUILD_NODE_OPTIONS:---max-old-space-size=3072}"
    healthcheck:
      disable: true
    volumes:
      - type: bind
        source: ${FRONTEND_SOURCE_DIR:-..}
        target: /workspace
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${FRONTEND_OUTPUT_DIR:-./output}
        target: /output
        bind:
          create_host_path: false
      - type: bind
        source: ${FRONTEND_PLUGIN_OUTPUT_DIR:-${FRONTEND_DATA_DIR:-./data}/plugins}
        target: /plugins
        bind:
          create_host_path: false
      - type: bind
        source: ${FRONTEND_DATA_DIR:-./data}/npm-cache
        target: /build/npm-cache
        bind:
          create_host_path: false
