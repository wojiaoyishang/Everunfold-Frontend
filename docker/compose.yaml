name: everunfold-frontend

x-frontend-image: &frontend-image
  image: ${FRONTEND_IMAGE:-everunfold-frontend:node22}
  build:
    context: .
    dockerfile: Dockerfile

services:
  frontend:
    <<: *frontend-image
    init: true
    restart: unless-stopped
    stop_grace_period: ${FRONTEND_STOP_GRACE_PERIOD:-35s}
    env_file: ${FRONTEND_ENV_FILE:-./runtime.env}
    environment:
      FRONTEND_PORT: "${FRONTEND_WEB_PORT:-3000}"
    ports:
      - "${FRONTEND_BIND_ADDRESS:-127.0.0.1}:${FRONTEND_PUBLISH_PORT:-3000}:${FRONTEND_WEB_PORT:-3000}"
    volumes:
      - type: bind
        source: ${FRONTEND_ARTIFACT_DIR:-./output/pre-1}
        target: /workspace
        bind:
          create_host_path: false
      - type: bind
        source: ${FRONTEND_DATA_DIR:-./data}
        target: /data
        bind:
          create_host_path: false
    networks:
      everunfold:
        aliases: [everunfold-frontend]

  builder:
    <<: *frontend-image
    profiles: [build]
    init: true
    environment:
      FRONTEND_BUILD_WORKERS: "${FRONTEND_BUILD_WORKERS:-2}"
      NODE_OPTIONS: "${FRONTEND_BUILD_NODE_OPTIONS:---max-old-space-size=3072}"
    healthcheck:
      disable: true
    volumes:
      - type: bind
        source: ${FRONTEND_SOURCE_DIR:-..}
        target: /workspace
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${FRONTEND_OUTPUT_DIR:-./output}
        target: /output
        bind:
          create_host_path: false
      - type: bind
        source: ${FRONTEND_DATA_DIR:-./data}/plugins
        target: /plugins
        bind:
          create_host_path: false

networks:
  everunfold:
    external: true
    name: ${EVERUNFOLD_NETWORK:-everunfold}
