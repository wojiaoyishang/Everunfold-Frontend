# 服务端实例配置示例；显式加载器读取 config.toml 或 CONFIG_FILE，拒绝未知字段。
# 本文件不作为自动回退；原始规划示例保留在 docs/baseline/。
# 独立接收器将公开设置和内容快照应用到本节点，配置方式见 docs/source/welcome/。

# everunfold-frontend/config.example.toml
# 仅在服务端加载；地址仅为可替换示例
# 前端自身身份，必须与后端 frontends 的对应配置键一致
BACKEND_BASE_URL = "http://127.0.0.1:8001"
# 可选的本机代理入口。使用独立连接文件时，将此字段放在相应的 [profiles.<id>] 中。
# browser_loopback_origin = "http://127.0.0.1:3000"
FRONTEND_NODE_ID = "web-main"
# 可选：连接独立保存在 backend-node.toml。启用时移除 BACKEND_BASE_URL、
# [backend] 和 settings.source_epoch。相对路径以主配置文件所在目录为准。
# backend_node_file = "./backend-node.toml"
# 可选：前台正式公开根地址，用于文章 canonical / Open Graph；不从请求 Host 或 API 地址推导。
# PUBLIC_SITE_URL = "https://blog.example.com"

[nodes_monitor]
enabled = false
# 生产使用 HTTPS。本机开发仅允许回环地址。
# origin = "https://blog.example.com"
# 运行 npm run nodes:password 生成哈希。
# password_hash = "scrypt$..."
session_secret_env = "EVERUNFOLD_FRONTEND_NODES_SESSION_SECRET"

[backend]
# Next.js 服务端访问 FastAPI 的连接地址
# 可省略：省略时使用部署已配置的公开 BACKEND_BASE_URL
# 显式覆盖仅作用于服务端，不替代浏览器的公开 API 地址
# base_url = "http://127.0.0.1:8001"
# 本轮建议初值：仅服务端连接超时，待压测
connect_timeout_seconds = 2
request_timeout_seconds = 15

# FastAPI/Celery Worker -> Next.js：接收请求时允许的实际 socket 来源
# 以下仅为本机联调；生产填写实际连接来源 IP/CIDR，不从 base_url 推导
allowed_peer_ips = ["127.0.0.1", "::1"]

# Next.js -> FastAPI：前端发送时使用
# 与后端 frontends.web-main 下同名字段解析出的实际 Token 值一致
nextjs_to_fastapi_token_env = "NEXTJS_TO_FASTAPI_WEB_MAIN_TOKEN"

# FastAPI/Celery Worker -> Next.js：前端接收并校验
# 与后端 frontends.web-main 下同名字段解析出的实际 Token 值一致
fastapi_to_nextjs_token_env = "FASTAPI_TO_NEXTJS_WEB_MAIN_TOKEN"

# 本地快照设置，与后端连接设置分开；仍为仅服务端配置
# 本轮建议初值，待压测；相对目录以本项目配置根解析
[cache]
directory = "./var/public-snapshots"
max_snapshot_bytes = 8388608
max_concurrent_fetches = 4
max_total_bytes = 2147483648
min_free_bytes = 536870912
rebuild_concurrency = 2

# 设置副本与接收器；部署时填写从后端已鉴权响应获取的真实 source_epoch。
# 未绑定 epoch 时不启用接收；不能通过首个请求自动认领来源。
[settings]
directory = "./var/settings"
receiver_host = "127.0.0.1"
receiver_port = 3001
# source_epoch = "实际后端 UUID"

# 实例默认主题；后台已保存的 extensions.theme 优先。选择“实例默认”后使用此项。
[theme]
active = "argon"
# 可选择随项目提供的paper子主题；FRONTEND_THEME环境变量可覆盖。

# 独立编译的可信插件产物。npm run dev 自动改用 var/cache/plugins。
[plugins]
directory = "./plugins"
# PLUGINS_DIRECTORY 可覆盖；不配置源码目录或远程URL。
