<rect x="20" y="679" width="412" height="87" rx="10" class="step"/><circle cx="53" cy="709" r="15" class="badge"/><text x="53" y="714" class="number" text-anchor="middle">6</text><text x="79" y="715" class="title" text-anchor="start">返回公开首屏</text><text x="79" y="743" class="detail" text-anchor="start">主题呈现导航和正文，路由提供元数据</text>
