<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 906"
     width="760" height="906">
  <defs>
    <marker id="head" viewBox="0 0 10 10" refX="8" refY="5"
            markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 9 5 L 0 10 Z" fill="#526a8c"/>
    </marker>
  </defs>
  <style>
    text {font-family: Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif}
    .step {fill: #fff; stroke: #b4c8e1; stroke-width: 1.4}
    .branch {fill: #fff8ed; stroke: #d6b289; stroke-width: 1.4}
    .badge {fill: #e1edff}
    .number {fill: #184485; font-size: 14px; font-weight: 700}
    .title {fill: #142747; font-size: 21px; font-weight: 700}
    .detail {fill: #344563; font-size: 17px}
    .transition {fill: #365b86; font-size: 15px}
    .arrow {fill: none; stroke: #526a8c; stroke-width: 1.6}
  </style>
  <rect x="0.5" y="0.5" width="759" height="905"
        rx="15" fill="#f4f7fc" stroke="#d6e1f0"/>
<rect x="20" y="20" width="720" height="111" rx="10" class="step"/><circle cx="53" cy="50" r="15" class="badge"/><text x="53" y="55" class="number" text-anchor="middle">1</text><text x="79" y="56" class="title" text-anchor="start">准备两个仓库和数据服务</text><text x="79" y="84" class="detail" text-anchor="start">检出配套提交，安装 Python 3.12、uv、Node.js 22 和 npm 10。</text><text x="79" y="108" class="detail" text-anchor="start">启动 PostgreSQL 与 Redis，创建空库并给数据库角色授权。</text>
<path d="M 380 136 L 380 163" class="arrow" marker-end="url(#head)"/>

<rect x="20" y="171" width="720" height="111" rx="10" class="step"/><circle cx="53" cy="201" r="15" class="badge"/><text x="53" y="206" class="number" text-anchor="middle">2</text><text x="79" y="207" class="title" text-anchor="start">安装依赖，配置后端与节点</text><text x="79" y="235" class="detail" text-anchor="start">从 uv.lock 安装依赖，填写数据库、Redis、Broker 和网页 Origin。</text><text x="79" y="259" class="detail" text-anchor="start">启用 web-main 节点，为两个内部请求方向分别设置令牌。</text>
<path d="M 380 287 L 380 314" class="arrow" marker-end="url(#head)"/>

<rect x="20" y="322" width="720" height="111" rx="10" class="step"/><circle cx="53" cy="352" r="15" class="badge"/><text x="53" y="357" class="number" text-anchor="middle">3</text><text x="79" y="358" class="title" text-anchor="start">显式初始化数据库</text><text x="79" y="386" class="detail" text-anchor="start">运行 init.database.py 迁移和初始化管理员，再登记后端插件。</text><text x="79" y="410" class="detail" text-anchor="start">从已初始化的数据库查询 source_epoch。</text>
<path d="M 380 438 L 380 465" class="arrow" marker-end="url(#head)"/>

<rect x="20" y="473" width="720" height="111" rx="10" class="step"/><circle cx="53" cy="503" r="15" class="badge"/><text x="53" y="508" class="number" text-anchor="middle">4</text><text x="79" y="509" class="title" text-anchor="start">绑定前端实例</text><text x="79" y="537" class="detail" text-anchor="start">从 package-lock.json 安装依赖，填写公开网页与 API 地址。</text><text x="79" y="561" class="detail" text-anchor="start">沿用节点 ID、来源 UUID 和对应方向的令牌。</text>
<path d="M 380 589 L 380 616" class="arrow" marker-end="url(#head)"/>

<rect x="20" y="624" width="720" height="111" rx="10" class="step"/><circle cx="53" cy="654" r="15" class="badge"/><text x="53" y="659" class="number" text-anchor="middle">5</text><text x="79" y="660" class="title" text-anchor="start">分别启动两端进程</text><text x="79" y="688" class="detail" text-anchor="start">启动 FastAPI（8001）、Worker、Scheduler，检查后端就绪。</text><text x="79" y="712" class="detail" text-anchor="start">启动 Next.js（3000）与 Node 接收器（3001）。</text>
<path d="M 380 740 L 380 767" class="arrow" marker-end="url(#head)"/>

<rect x="20" y="775" width="720" height="111" rx="10" class="step"/><circle cx="53" cy="805" r="15" class="badge"/><text x="53" y="810" class="number" text-anchor="middle">6</text><text x="79" y="811" class="title" text-anchor="start">首次同步并验证读者页</text><text x="79" y="839" class="detail" text-anchor="start">打开「节点状态与维护」重新同步全部，核对回执与磁盘版本。</text><text x="79" y="863" class="detail" text-anchor="start">发布测试文章并访问公开页，复查前端 /health/ready。</text>
</svg>
